
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Trainingsplan 2027</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

h1, h2 {
    color: #ff6b00;
}

header {
    margin-bottom: 35px;
}

header p {
    color: #aaa;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 20px;
    margin-bottom: 35px;
}

.kaart, .onderdeel, .grafiek {
    background: #252525;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.kaart h2 {
    font-size: 30px;
    margin: 10px 0;
}

.kaart p {
    color: #bbb;
    margin: 0;
}

.formulier {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #ddd;
}

input {
    width: 100%;
    padding: 12px;
    background: #151515;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 16px;
}

button {
    background: #ff6b00;
    color: #101010;
    border: none;
    padding: 13px 20px;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #ff8c33;
}

.verwijderen {
    background: #444;
    color: white;
    margin: 0;
    padding: 8px 12px;
    font-size: 13px;
}

.training {
    padding: 18px 0;
    border-bottom: 1px solid #444;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.training:last-child {
    border-bottom: none;
}

.training p {
    color: #bbb;
}

.leeg {
    color: #aaa;
}

/* Grafieken */
.balken {
    height: 230px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding-top: 20px;
    overflow-x: auto;
}

.balkgroep {
    flex: 1;
    min-width: 35px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
}

.balk {
    width: 75%;
    background: #ff6b00;
    border-radius: 5px 5px 0 0;
    min-height: 2px;
}

.balk:hover {
    background: #ffaa55;
}

.balkwaarde {
    font-size: 12px;
    color: white;
    margin-bottom: 5px;
}

.balklabel {
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🚴 Mijn Trainingsplan 2027</h1>
    <p>Mijn persoonlijke wielrentrainingen</p>
</header>

<section class="dashboard">
    <div class="kaart">
        <p>Totaal kilometers</p>
        <h2 id="kilometers">0 km</h2>
    </div>

    <div class="kaart">
        <p>Trainingsuren</p>
        <h2 id="uren">0:00</h2>
    </div>

    <div class="kaart">
        <p>Gemiddelde snelheid</p>
        <h2 id="snelheid">0 km/u</h2>
    </div>

    <div class="kaart">
        <p>Aantal trainingen</p>
        <h2 id="aantal">0</h2>
    </div>
</section>

<section class="onderdeel">
    <h2>➕ Training toevoegen</h2>

    <form id="trainingForm">
        <div class="formulier">
            <div>
                <label for="datum">Datum</label>
                <input type="date" id="datum" required>
            </div>

            <div>
                <label for="afstand">Afstand (km)</label>
                <input type="number" id="afstand"
                       step="0.01" min="0.01" required>
            </div>

            <div>
                <label for="trainingsuren">Uren</label>
                <input type="number" id="trainingsuren"
                       min="0" value="0" required>
            </div>

            <div>
                <label for="minuten">Minuten</label>
                <input type="number" id="minuten"
                       min="0" max="59" value="0" required>
            </div>

            <div>
                <label for="hartslag">Gem. hartslag (bpm)</label>
                <input type="number" id="hartslag"
                       min="1" placeholder="Bijv. 145">
            </div>

            <div>
                <label for="vermogen">Gem. vermogen (watt)</label>
                <input type="number" id="vermogen"
                       min="1" placeholder="Bijv. 190">
            </div>
        </div>

        <button type="submit">Training opslaan</button>
    </form>
</section>

<section class="grafiek">
    <h2>📊 Kilometers per week</h2>
    <div id="weekGrafiek" class="balken"></div>
</section>

<section class="grafiek">
    <h2>📅 Kilometers per maand</h2>
    <div id="maandGrafiek" class="balken"></div>
</section>

<section class="onderdeel">
    <h2>📋 Mijn trainingen</h2>
    <div id="trainingenLijst"></div>
</section>

<script>
const opslagSleutel = "mijntrainingsplan2027";
let trainingen = [];

try {
    const opgeslagen = JSON.parse(
        localStorage.getItem(opslagSleutel) || "[]"
    );

    if (Array.isArray(opgeslagen)) {
        trainingen = opgeslagen;
    }
} catch (fout) {
    console.error("Kan trainingen niet laden", fout);
}

// Training toevoegen
document.getElementById("trainingForm").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        const datum = document.getElementById("datum").value;
        const afstand = Number(
            document.getElementById("afstand").value
        );
        const uren = Number(
            document.getElementById("trainingsuren").value
        );
        const minuten = Number(
            document.getElementById("minuten").value
        );
        const hartslag = Number(
            document.getElementById("hartslag").value
        ) || null;
        const vermogen = Number(
            document.getElementById("vermogen").value
        ) || null;

        const totaleMinuten = uren * 60 + minuten;

        if (
            !datum ||
            !Number.isFinite(afstand) ||
            afstand <= 0 ||
            !Number.isFinite(totaleMinuten) ||
            totaleMinuten <= 0
        ) {
            alert("Vul een geldige afstand en tijd in.");
            return;
        }

        const training = {
            id: crypto.randomUUID(),
            datum: datum,
            afstand: afstand,
            minuten: totaleMinuten,
            hartslag: hartslag,
            vermogen: vermogen
        };

        trainingen.push(training);

        if (bewaarTrainingen()) {
            document.getElementById("trainingForm").reset();
            updateDashboard();
        } else {
            trainingen.pop();
        }
    }
);

// Trainingen opslaan
function bewaarTrainingen() {
    try {
        localStorage.setItem(
            opslagSleutel,
            JSON.stringify(trainingen)
        );
        return true;
    } catch (fout) {
        alert("Opslaan is niet gelukt.");
        return false;
    }
}

function berekenSnelheid(afstand, minuten) {
    return afstand / (minuten / 60);
}

// Dashboard
function updateDashboard() {
    let totaleAfstand = 0;
    let totaleMinuten = 0;

    trainingen.forEach(function(training) {
        totaleAfstand += training.afstand;
        totaleMinuten += training.minuten;
    });

    const uren = Math.floor(totaleMinuten / 60);
    const minuten = totaleMinuten % 60;

    const snelheid = totaleMinuten > 0
        ? berekenSnelheid(totaleAfstand, totaleMinuten)
        : 0;

    document.getElementById("kilometers").textContent =
        totaleAfstand.toFixed(1).replace(".", ",") + " km";

    document.getElementById("uren").textContent =
        uren + ":" + String(minuten).padStart(2, "0");

    document.getElementById("snelheid").textContent =
        snelheid.toFixed(1).replace(".", ",") + " km/u";

    document.getElementById("aantal").textContent =
        trainingen.length;

    toonTrainingen();
    updateGrafieken();
}

// Trainingen weergeven
function toonTrainingen() {
    const lijst = document.getElementById("trainingenLijst");
    lijst.innerHTML = "";

    if (trainingen.length === 0) {
        const tekst = document.createElement("p");
        tekst.className = "leeg";
        tekst.textContent = "Nog geen trainingen toegevoegd.";
        lijst.appendChild(tekst);
        return;
    }

    const gesorteerd = [...trainingen].sort(
        (a, b) => b.datum.localeCompare(a.datum)
    );

    gesorteerd.forEach(function(training) {
        const snelheid = berekenSnelheid(
            training.afstand,
            training.minuten
        );

        const uren = Math.floor(training.minuten / 60);
        const minuten = training.minuten % 60;

        const kaart = document.createElement("div");
        kaart.className = "training";

        const informatie = document.createElement("div");
        const titel = document.createElement("strong");

        titel.textContent =
            training.datum.split("-").reverse().join("-") +
            " — " +
            training.afstand.toFixed(1).replace(".", ",") +
            " km";

        const details = document.createElement("p");
        details.textContent =
            uren + ":" +
            String(minuten).padStart(2, "0") +
            " uur | " +
            snelheid.toFixed(1).replace(".", ",") +
            " km/u";

        informatie.appendChild(titel);
        informatie.appendChild(details);

        if (training.hartslag) {
            const hs = document.createElement("p");
            hs.textContent = "❤️ " + training.hartslag + " bpm";
            informatie.appendChild(hs);
        }

        if (training.vermogen) {
            const watt = document.createElement("p");
            watt.textContent = "⚡ " + training.vermogen + " watt";
            informatie.appendChild(watt);
        }

        const knop = document.createElement("button");
        knop.className = "verwijderen";
        knop.textContent = "Verwijderen";

        knop.addEventListener("click", function() {
            if (confirm("Wil je deze training verwijderen?")) {
                verwijderTraining(training.id);
            }
        });

        kaart.appendChild(informatie);
        kaart.appendChild(knop);
        lijst.appendChild(kaart);
    });
}

// Training verwijderen
function verwijderTraining(id) {
    const oudeTrainingen = trainingen;

    trainingen = trainingen.filter(
        training => training.id !== id
    );

    if (bewaarTrainingen()) {
        updateDashboard();
    } else {
        trainingen = oudeTrainingen;
    }
}

// Grafiek tekenen
function tekenGrafiek(elementId, gegevens) {
    const container = document.getElementById(elementId);
    container.innerHTML = "";

    const hoogste = Math.max(
        ...gegevens.map(g => g.km),
        1
    );

    gegevens.forEach(function(item) {
        const groep = document.createElement("div");
        groep.className = "balkgroep";

        const waarde = document.createElement("div");
        waarde.className = "balkwaarde";
        waarde.textContent = Math.round(item.km);

        const balk = document.createElement("div");
        balk.className = "balk";
        balk.style.height =
            (item.km / hoogste * 160) + "px";
        balk.title =
            item.km.toFixed(1) + " kilometer";

        const label = document.createElement("div");
        label.className = "balklabel";
        label.textContent = item.label;

        groep.appendChild(waarde);
        groep.appendChild(balk);
        groep.appendChild(label);

        container.appendChild(groep);
    });
}

// Week- en maandgrafieken
function updateGrafieken() {
    const nu = new Date();

    const vandaag = new Date(
        nu.getFullYear(),
        nu.getMonth(),
        nu.getDate()
    );

    const maandag = new Date(vandaag);
    maandag.setDate(
        vandaag.getDate() -
        ((vandaag.getDay() + 6) % 7)
    );

    const weken = [];

    for (let i = 7; i >= 0; i--) {
        const start = new Date(maandag);
        start.setDate(maandag.getDate() - i * 7);

        const einde = new Date(start);
        einde.setDate(start.getDate() + 7);

        let km = 0;

        trainingen.forEach(function(training) {
            const datum = new Date(
                training.datum + "T12:00:00"
            );

            if (datum >= start && datum < einde) {
                km += training.afstand;
            }
        });

        weken.push({
            label:
                start.getDate() + "/" +
                (start.getMonth() + 1),
            km: km
        });
    }

    const maanden = [];

    for (let i = 11; i >= 0; i--) {
        const start = new Date(
            vandaag.getFullYear(),
            vandaag.getMonth() - i,
            1
        );

        const jaar = start.getFullYear();
        const maand = start.getMonth();

        let km = 0;

        trainingen.forEach(function(training) {
            const datum = new Date(
                training.datum + "T12:00:00"
            );

            if (
                datum.getFullYear() === jaar &&
                datum.getMonth() === maand
            ) {
                km += training.afstand;
            }
        });

        maanden.push({
            label: start.toLocaleDateString(
                "nl-NL",
                { month: "short" }
            ),
            km: km
        });
    }

    tekenGrafiek("weekGrafiek", weken);
    tekenGrafiek("maandGrafiek", maanden);
}

// Website starten
updateDashboard();
</script>

</body>
</html>
