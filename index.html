
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn Trainingsplan 2027</title>

    <style>
        body {
            background-color: #101010;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #ff6b00;
            font-size: 40px;
        }

        p {
            color: #cccccc;
            font-size: 18px;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .kaart {
            background-color: #252525;
            padding: 25px;
            border-radius: 12px;
            flex: 1;
            min-width: 150px;
        }

        .kaart h2 {
            color: #ff6b00;
            font-size: 32px;
            margin: 0;
        }

        .kaart p {
            color: #cccccc;
            font-size: 16px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <h1>Mijn Trainingsplan 2027 🚴</h1>

    <p>Hier ga ik mijn wielrentrainingen bijhouden.</p>

    <div class="dashboard">

        <div class="kaart">
            <h2>125 km</h2>
            <p>Kilometers</p>
        </div>

        <div class="kaart">
            <h2>4:30</h2>
            <p>Trainingsuren</p>
        </div>

        <div class="kaart">
            <h2>28,5</h2>
            <p>Gemiddelde km/u</p>
        </div>

    </div>

</body>
</html>
